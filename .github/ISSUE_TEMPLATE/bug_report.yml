name: Bug report / 错误报告
description: Report a reproducible runtime, packaging, or documentation problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve lw.PPOCR.Java.

        Models are included in the latest Release: https://github.com/lxw112190/lw.PPOCR.Java/releases/latest

        Installation guide: https://github.com/lxw112190/lw.PPOCR.Java/blob/main/docs/installation.md
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Release tag or commit SHA.
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system / 操作系统
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version / Java 版本
      placeholder: Output of java -version
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend / 后端
      options:
        - Scalar
        - Vector API
        - Both
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include the smallest code sample and exact launch command when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs / 实际行为与日志
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 确认项
      options:
        - label: I removed secrets and private data from the logs. / 日志中不包含密钥或隐私数据。
          required: true
        - label: I am using models from the Release, or I have described how my custom LWM files were produced. / 我使用 Release 模型，或已说明自定义 LWM 的来源。
          required: true
