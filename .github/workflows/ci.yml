name: Java CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress verify

  performance:
    name: Loader performance (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build benchmark
        run: mvn --batch-mode --no-transfer-progress -pl lw-ppocr-benchmark -am package -DskipTests
      - name: Run benchmark
        run: |
          mkdir -p benchmark-results
          java -cp "lw-ppocr-core/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.LwmLoaderPerformanceMain \
            | tee benchmark-results/lwm-loader.json
      - name: Publish benchmark summary
        run: |
          echo '### LWM loader performance' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/lwm-loader.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: lwm-loader-performance
          path: benchmark-results/lwm-loader.json
