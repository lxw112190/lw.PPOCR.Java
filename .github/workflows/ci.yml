name: Java CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress verify

  performance:
    name: OCR performance (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build benchmark
        run: mvn --batch-mode --no-transfer-progress package -DskipTests
      - name: Run benchmark
        run: |
          mkdir -p benchmark-results
          java -cp "lw-ppocr-core/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.LwmLoaderPerformanceMain \
            | tee benchmark-results/lwm-loader.json
          java -cp "lw-ppocr-core/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.DbPostprocessPerformanceMain \
            | tee benchmark-results/db-postprocess.json
          java -cp "lw-ppocr-core/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.PpocrPreprocessPerformanceMain \
            | tee benchmark-results/ppocr-preprocess.json
          java -cp "lw-ppocr-core/target/classes:lw-ppocr-core/target/test-classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.ModelCompatibilityMain \
            | tee benchmark-results/model-compatibility.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.MatMulPerformanceMain vector \
            | tee benchmark-results/rec-projection-matmul.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.StrideTwoConvPerformanceMain vector \
            | tee benchmark-results/rec-stride-two-conv.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.DetStrideTwoConvPerformanceMain vector stem \
            | tee benchmark-results/det-stem-stride-two-conv.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.DetStrideTwoConvPerformanceMain vector downsample \
            | tee benchmark-results/det-downsample-stride-two-conv.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.DetStrideTwoConvPerformanceMain vector downsample960 \
            | tee benchmark-results/det-downsample960-stride-two-conv.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.StrideOneConvPerformanceMain vector \
            | tee benchmark-results/det-stride-one-conv.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.StrideOneConvPerformanceMain vector 20 30 128 \
            | tee benchmark-results/det-stride-one-conv-det960.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.TwoByTwoConvPerformanceMain vector reduce \
            | tee benchmark-results/det-two-by-two-reduce.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.TwoByTwoConvPerformanceMain vector expand \
            | tee benchmark-results/det-two-by-two-expand.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.MaxPoolPerformanceMain vector \
            | tee benchmark-results/det-max-pool.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.DepthwiseConvPerformanceMain scalar cls 50 100 \
            | tee benchmark-results/cls-depthwise-scalar.json
          java --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.DepthwiseConvPerformanceMain vector cls 50 100 \
            | tee benchmark-results/cls-depthwise-vector.json
          java -Xms64m -Xmx512m -cp "lw-ppocr-core/target/classes:lw-ppocr-core/target/test-classes:lw-ppocr-imageio/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.FullOcrPerformanceMain 1 3 320 \
            | tee benchmark-results/full-ocr-det320.json
          java -Xms64m -Xmx512m -cp "lw-ppocr-core/target/classes:lw-ppocr-core/target/test-classes:lw-ppocr-imageio/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.FullOcrPerformanceMain 1 3 960 \
            | tee benchmark-results/full-ocr-default.json
          java -Xms64m -Xmx512m --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-core/target/test-classes:lw-ppocr-imageio/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.FullOcrPerformanceMain 1 3 320 vector \
            | tee benchmark-results/full-ocr-vector-det320.json
          java -Xms64m -Xmx512m --add-modules jdk.incubator.vector \
            -cp "lw-ppocr-core/target/classes:lw-ppocr-core/target/test-classes:lw-ppocr-imageio/target/classes:lw-ppocr-vector/target/classes:lw-ppocr-benchmark/target/classes" \
            io.github.lxw112190.ppocr.benchmark.FullOcrPerformanceMain 1 3 320 vector 4 4 \
            | tee benchmark-results/full-ocr-vector-parallel-det320.json
      - name: Publish benchmark summary
        run: |
          echo '### LWM loader performance' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/lwm-loader.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DB postprocess performance' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/db-postprocess.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### PP-OCR preprocessing performance' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/ppocr-preprocess.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Tiny model compatibility and workload' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/model-compatibility.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### REC projection MatMul performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/rec-projection-matmul.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### REC stride-two Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/rec-stride-two-conv.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET stem stride-two Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-stem-stride-two-conv.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET downsample stride-two Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-downsample-stride-two-conv.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET 960 downsample stride-two Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-downsample960-stride-two-conv.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET stride-one Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-stride-one-conv.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET 960 stride-one Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-stride-one-conv-det960.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET 2x2 reduce Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-two-by-two-reduce.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET 2x2 expand Conv performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-two-by-two-expand.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### DET MaxPool performance (Vector API)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/det-max-pool.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### CLS 5x5 depthwise performance (same-run Scalar and Vector)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/cls-depthwise-scalar.json >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/cls-depthwise-vector.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Full OCR performance and JVM heap (Scalar baseline, DET 320)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/full-ocr-det320.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Full OCR performance and JVM heap (Scalar baseline, DET 960)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/full-ocr-default.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Full OCR performance and JVM heap (Vector API, DET 320, REC x1)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/full-ocr-vector-det320.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Full OCR performance and JVM heap (Vector API, CLS x4, REC width groups x4)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/full-ocr-vector-parallel-det320.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: ppocr-performance
          path: benchmark-results/*.json
